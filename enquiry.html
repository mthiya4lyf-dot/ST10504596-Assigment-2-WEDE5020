<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraTech Solutions - Service Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CobraTech Solutions</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Request a Service or Consultation</h2>
            <p>Fill out the service form below, and our technical team will respond within 24 hours.</p>

            <form action="#" method="post">
                <p>
                    <label for="fullName">Full Name:</label><br>
                    <input type="text" id="fullName" name="fullName" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Contact Number:</label><br>
                    <input type="tel" id="phone" name="phone" required>
                </p>

                <p>
                    <label for="serviceType">Service Category:</label><br>
                    <select id="serviceType" name="serviceType">
                        <option value="it-support">IT Support & Hardware</option>
                        <option value="networking">Network Setup & Security</option>
                        <option value="graphic-design">Graphic Design & Branding</option>
                        <option value="presentation">Presentation & Infographics</option>
                    </select>
                </p>

                <p>
                    <label for="message">Project Details:</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>

                <p>
                    <button type="submit">Submit Enquiry</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CobraTech Solutions. All rights reserved.</p>
    </footer>
</body>
</html>
